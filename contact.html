<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap</title>
    <link rel="stylesheet" href="assets/css/intro-home.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
     <!--Header -->
    <header class="main-header">
       <div class="logo-section">
          <img src="assets/images/homeinp/Swaplogo.png" >
       </div>
      
       <div class="navigation-bar">
         <div><a href="index.html" class="nav-link">Home</a></div> 
         <div><a href="about.html" class="nav-link">About Us</a></div>
         <div><a href="contact.html" class="nav-link">Contact Us</a></div>
       </div>

       <div class="user-navigation-bar">
         <a  href="auth/login.html" class="link-login-btn">Log in </a>
         <a  href="auth/signup1.html" class="link-signup-btn">Sign Up</a>
        </div>
     

      
    </header>
    
   <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="content-wrapper">
                <div class="text-content">
                    <h1 class="main-title"> Contact us  </h1>
                    <p class="subtitle">We'd love  to  hear from you! 
                        <br>Whether you have a question, a suggestion, or comment   feel free to reach out. </p>
                    
                        
                   
                </div>
              <img src="assets/images/homeinp/contactpic.png"  class="image-content contactpicture float-animation">
            </div>
           
        </div>
    </section>
   <section id="contact" class="contact-section">
  <div class="contact-container">
    <p class="contact-title">Send us a Message</p>
    
    <div id="success-message" class="success-message" style="display: none;">
        Your message has been sent successfully! We'll get back to you soon.
    </div>

    <div id="error-message" class="error-message" style="display: none;"></div>
    
    <form id="contact-form" method="post" class="contact-form">
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" placeholder="Your first name" required>
          <span id="first_name-error" class="error-text"></span>
        </div>

        <div class="form-group">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" placeholder="Your last name" required>
          <span id="last_name-error" class="error-text"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
        <span id="email-error" class="error-text"></span>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us more about your inquiry..." required></textarea>
        <span id="message-error" class="error-text"></span>
      </div>

      <div class="form-group">
        <button type="submit" class="send-btn" id="submit-btn">Send</button>
      </div>
    </form>
  </div>
</section>

  

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 Swap. All rights reserved.</p>
        </div>
    </footer>
 
 
 <script src="assets/js/home.js"></script>
  
 <script>
    // Contact form AJAX submission
    document.getElementById('contact-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        // Hide previous messages
        document.getElementById('success-message').style.display = 'none';
        document.getElementById('error-message').style.display = 'none';
        
        // Clear error messages
        document.querySelectorAll('.error-text').forEach(el => el.textContent = '');
        
        // Disable submit button
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';
        
        // Get form data
        const formData = new FormData(this);
        
        // Send via AJAX using fetch
        fetch('contact_process.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                // Show success message
                document.getElementById('success-message').textContent = data.message;
                document.getElementById('success-message').style.display = 'block';
                
                // Reset form
                document.getElementById('contact-form').reset();
                
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send';
            } else {
                // Show error message
                document.getElementById('error-message').textContent = 'Error: ' + data.message;
                document.getElementById('error-message').style.display = 'block';
                
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('error-message').textContent = 'An error occurred while submitting the form. Please try again.';
            document.getElementById('error-message').style.display = 'block';
            
            // Re-enable button
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send';
        });
    });

    // Real-time validation feedback
    document.getElementById('first_name').addEventListener('input', function() {
        document.getElementById('first_name-error').textContent = '';
    });

    document.getElementById('last_name').addEventListener('input', function() {
        document.getElementById('last_name-error').textContent = '';
    });

    document.getElementById('email').addEventListener('input', function() {
        document.getElementById('email-error').textContent = '';
    });

    document.getElementById('message').addEventListener('input', function() {
        document.getElementById('message-error').textContent = '';
    });
 </script>

</body>
</html>
