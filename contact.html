<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap</title>
    <link rel="stylesheet" href="assets/css/intro-home.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
     <!--Header -->
    <header class="main-header">
       <div class="logo-section">
          <img src="assets/images/homeinp/Swaplogo.png " >
       </div>
      
       <div class="navigation-bar">
         <div><a href="index.html" class="nav-link">Home</a></div> 
         <div><a href="about.html" class="nav-link">About Us</a></div>
         <div><a href="contact.html" class="nav-link">Contact Us</a></div>
       </div>

       <div class="user-navigation-bar">
         <a  href="auth/login.html" class="link-login-btn">Log in </a>
         <a  href="auth/signup1.html" class="link-signup-btn">Sign Up</a>
        </div>
     

      
    </header>
    
   <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="content-wrapper">
                <div class="text-content">
                    <h1 class="main-title"> Contact us  </h1>
                    <p class="subtitle">We'd love  to  hear from you! 
                        <br>Whether you have a question, a suggestion, or comment   feel free to reach out. </p>
                    
                        
                   
                </div>
              <img src="assets/images/homeinp/contactpic.png"  class="image-content contactpicture float-animation">
            </div>
           
        </div>
    </section>
   <section id="contact" class="contact-section">
  <div class="contact-container">
    <p class="contact-title">Send us a Message<p>
    
    <form  method="post" class="contact-form">
      <div class="form-row">
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="first-name" placeholder="Your first name" required>
        </div>

        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="last-name" placeholder="Your last name" required>
        </div>
      

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us more about your inquiry..." required></textarea>
      </div>

      <div class="form-group"><button type="submit" class="send-btn">Send</button></div>
       </div>
  

        </form>
        
      </div>

    </section>

  

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 Swap. All rights reserved.</p>
        </div>
    </footer>
 
 
 <script src="assets/js/home.js"></script>
</body>
</html>
