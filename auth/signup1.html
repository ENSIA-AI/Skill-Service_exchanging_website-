<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/signuppages.css">


    <title>Sign Up - Swap</title>
</head>
<body>
    <div class="signup-container">
        <!-- Left Side/Illustration -->
        <div class="signup-left">
            <div class="illustration">
                <img src="/assets/images/homeinp/signupside.jpg" alt="Join Community">
            </div>
        </div>

        <!-- Right Side/Signup Form -->
        <div class="signup-right">
            <h2>Personal Information</h2>
            
            <form action="/auth/signup2.html" method="GET" class="signup-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Smith" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="City, Country" required>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to Terms & Conditions</label>
                </div>
                  <div class="form-actions">
                    <button type="button" class="btn-back" onclick="window.location.href='../index.html'">Back</button>
                    <button type="submit" class="btn-next">Next</button>
                </div>
            </form>

            <p class="login-link">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

   <script src="/assets/js/formvalidation.js"></script>  
</body>
</html>
