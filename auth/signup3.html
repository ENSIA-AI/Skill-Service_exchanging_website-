<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
     <link rel="stylesheet" href="../assets/css/signuppages.css">
    <title>Sign Up - Availability & Preferences</title>
</head>
<body>
    <div class="signup-container   availability-page">
        <!-- Left Side/Illustration -->
        <div class="signup-left">
            <div class="illustration">
                <img src="../assets/images/homeinp/signupside.jpg" alt="Availability Illustration">
            </div>
        </div>

        <!-- Right Side/Availability Form -->
        <div class="signup-right">
            <h2>Availability & Preferences</h2>
            
            <form action="../dashboard/post/posts.php" method="post">
                <!-- Meeting Preference -->
                <div class="form-group">
                    <label>Meeting Preference</label>
                    <div class="preference-options">
                        <label class="option-radio">
                            <input type="radio" name="meetingPreference" value="online" checked>
                            <span class="radio-label">Online</span>
                        </label>
                        <label class="option-radio">
                            <input type="radio" name="meetingPreference" value="in-person">
                            <span class="radio-label">In-Person</span>
                        </label>
                        <label class="option-radio">
                            <input type="radio" name="meetingPreference" value="both">
                            <span class="radio-label">Both</span>
                        </label>
                    </div>
                </div>

                <!-- Available Days -->
                <div class="form-group">
                    <label>Available Days</label>
                    <div class="days-grid">
                        <label class="day-checkbox">
                            <input type="checkbox" name="availableDays" value="mon">
                            <span class="day-label">Mon</span>
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="availableDays" value="tue">
                            <span class="day-label">Tue</span>
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="availableDays" value="wed">
                            <span class="day-label">Wed</span>
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="availableDays" value="thu">
                            <span class="day-label">Thu</span>
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="availableDays" value="fri">
                            <span class="day-label">Fri</span>
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="availableDays" value="sat">
                            <span class="day-label">Sat</span>
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="availableDays" value="sun">
                            <span class="day-label">Sun</span>
                        </label>
                    </div>
                </div>

                <!-- Time Slots -->
                <div class="form-group">
                    <label>Time Slots</label>
                    <div class="time-slots">
                        <label class="time-checkbox">
                            <input type="checkbox" name="timeSlots" value="morning">
                            <span class="time-label">Morning (6AM-12PM)</span>
                        </label>
                        <label class="time-checkbox">
                            <input type="checkbox" name="timeSlots" value="afternoon">
                            <span class="time-label">Afternoon (12PM-6PM)</span>
                        </label>
                        <label class="time-checkbox">
                            <input type="checkbox" name="timeSlots" value="evening">
                            <span class="time-label">Evening (6PM-10PM)</span>
                        </label>
                        <label class="time-checkbox">
                            <input type="checkbox" name="timeSlots" value="late-night">
                            <span class="time-label">Late Night (10PM-2AM)</span>
                        </label>
                    </div>
                </div>

                <!-- Timezone -->
                <div class="form-group">
                    <label for="timezone">Timezone</label>
                    <select id="timezone" name="timezone" required>
                        <option value="">Select your timezone</option>
                        <option value="est">EST (Eastern Time)</option>
                        <option value="cst">CST (Central Time)</option>
                        <option value="pst">PST (Pacific Time)</option>
                        <option value="mst">MST (Mountain Time)</option>
                        <option value="gmt">GMT (Greenwich Mean Time)</option>
                        <option value="cet">CET (Central European Time)</option>
                    </select>
                </div>

                <!-- Notifications -->
                <div class="form-check">
                    <input type="checkbox" id="notifications" name="notifications" checked>
                    <label for="notifications">Receive email notifications for matches and messages</label>
                </div>

                <!-- Terms & Privacy -->
                <div class="form-check">
                    <input type="checkbox" id="policy" name="policy" required>
                    <label for="policy">I agree to the Terms & Conditions and Privacy Policy</label>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                   <button type="button" class="btn-back" onclick="window.location.href='signup2.html'">Back</button>
                    <button type="submit" class="btn-create">Create Account</button>
                </div>
            </form>

            <p class="login-link">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

 <script src="/assets/js/formvalidation.js"></script> 
 <script src="/assets/js/home.js"></script>
 
</body>
</html>
