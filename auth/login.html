<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillSwap</title>
</head>
<body>
    <div class="signup-container">
        <!-- Left Side /Illustration -->
        <div class="signup-left">
            <div class="illustration">
                <img src="assets/images/homeinp/login-illustration.png" alt="Welcome Back">
            </div>
        </div>

        <!-- Right Side /Login Form -->
        <div class="signup-right">
            <div class="logo">
                <h1>Swap</h1>
            </div>
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to continue your learning journey</p>
            
            <div class="divider"></div>
            
            <form action="/dashboard.html" method="POST" class="login-form">
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input type="text" id="email" name="email" placeholder="Enter your email or username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <div class="form-check">
                        <input type="checkbox" id="remember" name="remember" checked>
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="/forgot-password.html" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <div class="social-divider">
                <span>Or continue with</span>
            </div>

            <div class="social-login">
                <button type="button" class="btn-social btn-google">
                    <img src="assets/icons/google-icon.png" alt="Google">
                    Google
                </button>
                <button type="button" class="btn-social btn-facebook">
                    <img src="assets/icons/facebook-icon.png" alt="Facebook">
                    Facebook
                </button>
            </div>

            <p class="signup-link">
                Don't have an account? <a href="/auth/signup1.html">Sign Up</a>
            </p>
        </div>
    </div>
  <script src="/assets/js/formvalidation.js"></script>
</body>
</html>
