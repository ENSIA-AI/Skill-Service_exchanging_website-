<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../assets/css/login.css">
    <title>Login - SkillSwap</title>
</head>
<body>
    <div class="login-container">
        <!-- Left Side -->
        <div class="login-left">
            <div class="illustration">
                <img src="../assets/images/7943139_3779554.svg" alt="Welcome Back">
            </div>
        </div>

        <!-- Right Side -->
        <div class="login-right">
            <div class="logo">
                <h1>Swap</h1>
            </div>
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to continue your learning journey</p>
            
            <div class="divider"></div>
            
            <form action="../components/posts.html" method="POST" class="login-form">
                <div class="form-group email">
                    <label for="email">Email or Username</label>
                    <input type="text" id="email" name="email" placeholder="Enter your email or username" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group password">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-options">
                    <div class="form-check">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="../forgot-password.html" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login" disabled>Login</button>
            </form>

            <p class="signup-link">
                Don't have an account? <a href="signup1.html">Sign Up</a>
            </p>
        </div>
    </div>

    
    
   <script> 
    window.addEventListener("load", () => {
    const form = document.querySelector('.login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberMe = document.getElementById('remember');
    const submitBtn = form.querySelector('.btn-login');
    
    // Track if fields have been touched
    let emailTouched = false;
    let passwordTouched = false;
    
    // Show error messages
    function showError(input, message) {
        const errorMsg = input.nextElementSibling;
        errorMsg.textContent = message;
        input.classList.add('error');
    }
    
    function clearError(input) {
        const errorMsg = input.nextElementSibling;
        errorMsg.textContent = '';
        input.classList.remove('error');
    }
    
    function isValidEmail(email) {
        return /\S+@\S+\.\S+/.test(email);
    }
    
    function isValidPassword(password) {
        return password.length >= 6 && /[A-Za-z]/.test(password) && /\d/.test(password);
    }
    
    // Mark field as touched when focused
    emailInput.addEventListener('focus', () => {
        emailTouched = true;
    });
    
    passwordInput.addEventListener('focus', () => {
        passwordTouched = true;
    });
    
    // input validation
    [emailInput, passwordInput].forEach(input => {
        input.addEventListener('input', () => {
            if (input === emailInput && emailTouched) {
                if (!input.value.trim()) showError(input, "Email is required");
                else if (!isValidEmail(input.value.trim())) showError(input, "Email is not valid");
                else clearError(input);
            }
            if (input === passwordInput && passwordTouched) {
                if (!input.value.trim()) showError(input, "Password is required");
                else if (!isValidPassword(input.value.trim())) showError(input, "Password must be at least 6 characters and contain letters and numbers");
                else clearError(input);
            }
        });
    });
    
    // Form submission
    form.addEventListener("submit", (event) => {
        event.preventDefault();
        let valid = true;
        
        // Mark both fields as touched when form is submitted
        emailTouched = true;
        passwordTouched = true;
        
        // Check if email is empty first, then validate
        if (!emailInput.value.trim()) {
            showError(emailInput, "Email is required");
            valid = false;
        } else if (!isValidEmail(emailInput.value.trim())) {
            showError(emailInput, "Please enter a valid email");
            valid = false;
        }
        
        // Check if password is empty first, then validate
        if (!passwordInput.value.trim()) {
            showError(passwordInput, "Password is required");
            valid = false;
        } else if (!isValidPassword(passwordInput.value.trim())) {
            showError(passwordInput, "Please enter a valid password");
            valid = false;
        }
        
        if (!valid) return;
        
        // Save remembered user
        if (rememberMe.checked) localStorage.setItem("rememberedUser", emailInput.value.trim());
        else localStorage.removeItem("rememberedUser");
        
        // Redirect if valid
        window.location.href = "/Skill-Service_exchanging_website-/dashboard/post/posts.php";
    });
    
    // Make sure button is enabled on load
    submitBtn.disabled = false;
});
</script>
</body>
</html>
