<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/login.css">
    <title>Login - SkillSwap</title>
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Image/Illustration -->
        <div class="login-left">
            <div class="illustration">
                <img src="/assets/images/7943139_3779554.svg" alt="Welcome Back">
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="login-right">
            <div class="logo">
                <h1>Swap</h1>
            </div>
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to continue your learning journey</p>
            
            <div class="divider"></div>
            
            <form action="/components/posts.html" method="POST" class="login-form">
                <div class="form-group email">
                    <label for="email">Email or Username</label>
                    <input type="text" id="email" name="email" placeholder="Enter your email or username" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group password">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-options">
                    <div class="form-check">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="/forgot-password.html" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login" disabled>Login</button>
            </form>

            <div class="social-divider">
                <span>Or continue with</span>
            </div>

            <div class="social-login">
                <button type="button" class="btn-social btn-google">
                    <img src="/assets/icons/google-color-icon.svg" alt="Google">
                    Google
                </button>
                <button type="button" class="btn-social btn-facebook">
                    <img src="/assets/icons/facebook-round-color-icon.svg" alt="Facebook">
                    Facebook
                </button>
            </div>

            <p class="signup-link">
                Don't have an account? <a href="/auth/signup1.html">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Import home.js first -->
    <script src="/assets/js/home.js"></script>
    <!-- Login logic using home.js functions -->
    <script>
window.addEventListener("load", () => {
    const form = document.querySelector('.login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberMe = document.getElementById('remember');
    const submitBtn = form.querySelector('.btn-login');

    // Enable button only when inputs have some value
    function toggleButton() {
        submitBtn.disabled = !(emailInput.value.trim() && passwordInput.value.trim());
    }

    // Show error messages
    function showError(input, message) {
        const errorMsg = input.nextElementSibling;
        errorMsg.textContent = message;
        input.classList.add('error');
    }

    function clearError(input) {
        const errorMsg = input.nextElementSibling;
        errorMsg.textContent = '';
        input.classList.remove('error');
    }

    function isValidEmail(email) {
        return /\S+@\S+\.\S+/.test(email);
    }

    function isValidPassword(password) {
        return password.length >= 6 && /[A-Za-z]/.test(password) && /\d/.test(password);
    }

    // Live input validation
    [emailInput, passwordInput].forEach(input => {
        input.addEventListener('input', () => {
            if (input === emailInput) {
                if (!input.value.trim()) showError(input, "Email is required");
                else if (!isValidEmail(input.value.trim())) showError(input, "Email is not valid");
                else clearError(input);
            }
            if (input === passwordInput) {
                if (!input.value.trim()) showError(input, "Password is required");
                else if (!isValidPassword(input.value.trim())) showError(input, "Password must be at least 6 characters and contain letters and numbers");
                else clearError(input);
            }
            toggleButton();
        });
    });

    // Form submission
    form.addEventListener("submit", (event) => {
        event.preventDefault();

        let valid = true;

        if (!emailInput.value.trim() || !isValidEmail(emailInput.value.trim())) {
            showError(emailInput, "Please enter a valid email");
            valid = false;
        }

        if (!passwordInput.value.trim() || !isValidPassword(passwordInput.value.trim())) {
            showError(passwordInput, "Please enter a valid password");
            valid = false;
        }

        if (!valid) return;

        // Save remembered user
        if (rememberMe.checked) localStorage.setItem("rememberedUser", emailInput.value.trim());
        else localStorage.removeItem("rememberedUser");

        // Redirect if valid
        window.location.href = "/components/posts.html";
    });

    toggleButton();
});
</script>

</body>
</html>
