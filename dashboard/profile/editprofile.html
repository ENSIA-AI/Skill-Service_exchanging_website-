<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="icon" href="../../assets/icons/favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/editpersonalprofile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div>
            <div>
                <h2><strong><span style="color: white;">Edit Profile</span></strong></h2>
            </div>
            <div><span style="color: white;">Update your information and skills</span></div>
        </div>
    </header>
    <main>
        <div>
            <div>
                <form id="update-profile-form" action="#" method="post">
                    <div class="section profile-picture-section">
                        <div class="profile-picture-section-header">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="25" height="25"
                                role="img" aria-label="Camera icon" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" style="color: white;">
                                <title>Camera</title>
                                <path
                                    d="M3 7.5h3l1.2-1.8A1 1 0 0 1 8.1 5h7.8a1 1 0 0 1 .9.7L18 7.5h3A1.5 1.5 0 0 1 22.5 9V19.5A1.5 1.5 0 0 1 21 21H3A1.5 1.5 0 0 1 1.5 19.5V9A1.5 1.5 0 0 1 3 7.5z" />
                                <circle cx="12" cy="14" r="3.2" />
                            </svg>
                            <span class="section-title">Profile Picture</span>
                        </div>
                        <div class="profile-picture-section-content">
                            <figure style="margin: 0;">
                                <div class="edit-profile-avatar">
                                    <img src="../../assets/icons/favicon_io/android-chrome-512x512.png" alt="">
                                </div>
                            </figure>
                            <div>
                                <h4><span class="section-title">Upload New Photo</span></h4>
                                <span class="muted-text">JPG, PNG or GIF. Max size 2MB. Recommended: 400x400px</span>
                                <div style="display: flex; margin-top: 25px;">
                                    <div>
                                        <input type="file" title="Upload Photo">
                                    </div>
                                    <div>
                                        <button type="button">Remove Picture</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="section">
                        <div class="profile-picture-section-header">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="25" height="25"
                                role="img" aria-label="User icon" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" style="color: white;">
                                <title>User</title>
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            <span class="section-title">Basic Information</span>
                        </div>
                        <div class="">
                            <div class="label">
                                <label for="username">username*</label>
                            </div>
                            <input class="textbox user-name-icon" type="text" placeholder="username"
                                pattern="^(?![_.])(?!.*[_.]{2})[a-z0-9._]{3,20}(?<![_.])$"
                                title="3–20 chars, lowercase letters, numbers, underscores (_) and dots (.) only. Cannot start or end with _ or ., or contain consecutive _ or ."
                                required />
                        </div>
                        <div class="">
                            <div class="label">
                                <label for="fullname">Full Name*</label>
                            </div>
                            <input class="textbox full-name-icon" type="text" placeholder="Full Name" required />
                        </div>
                        <div class="">
                            <div class="label">
                                <label for="professionaltitle">Professional Title*</label>
                            </div>
                            <input class="textbox professional-title-icon" type="text" placeholder="Professional Title"
                                required />
                        </div>
                        <div class="">
                            <div class="label">
                                <label for="location">Location*</label>
                            </div>
                            <input class="textbox location-icon" type="text" placeholder="Location: City, Country"
                                required />
                        </div>
                        <div class="">
                            <div class="label">
                                <label for="aboutme">About Me</label>
                            </div>
                            <input class="textbox-about-me" type="text" placeholder="About Me" />
                        </div>
                    </div>
                    <div class="section">
                        <div class="profile-picture-section-header">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="25" height="25"
                                role="img" aria-label="User icon" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" style="color: white;">
                                <title>User</title>
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            <span class="section-title">Contact Information</span>
                        </div>
                        <div class="">
                            <div class="label">
                                <label for="email">Email*</label>
                            </div>
                            <input class="textbox email-icon" type="email" placeholder="Email" required />
                        </div>

                        <div class="">
                            <div class="label">
                                <label for="phone">Phone Number*</label>
                            </div>
                            <input class="textbox phone-icon" type="tel" placeholder="Phone" required />
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
