<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create event</title>
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
    <link rel="stylesheet" href="../../assets/css/addevent.css">
</head>
<body>
   <div class="container">
        <h1>Create New Event</h1>
        
        <form class="event-form" id="eventForm">
            <!-- Event Title -->
            <div class="form-section">
                <label for="event-title">Event Title</label>
                <input type="text" id="event-title" name="event-title" placeholder="e.g., Web Development Workshop" required>
            </div>

            <!-- Event Date and Location in one row -->
            <div class="form-row">
                <div class="form-section">
                    <label for="event-date">Event Date</label>
                    <input type="date" id="event-date" name="event-date" required>
                </div>
                
                <div class="form-section">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="e.g., Community Center" required>
                </div>
            </div>

            <!-- Description -->
            <div class="form-section">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" placeholder="Describe your event..." required></textarea>
            </div>

            <!-- Max Attendees -->
            <div class="form-section">
                <label for="max-attendees">Max Attendees</label>
                <input type="number" id="max-attendees" name="max-attendees" placeholder="e.g., 20" min="1" max="1000" required>
            </div>

            <!-- Skills Needed Section -->
            <div class="form-section">
                <div class="skills-section">
                    <!-- Skills Header -->
                    <div class="skills-header">
                        <div class="skills-title">Skills Needed</div>
                        <div class="skills-counter">0/5</div>
                    </div>

                    <!-- Grouped container for category, skill, and add button -->
                    <div class="skills-input-group">
                        <div class="skills-category-row">
                            <div class="category-skill-row">
                                <div class="input-group">
                                    <label for="skillsCategory">Category</label>
                                    <div class="select-wrapper">
                                        <select id="skillsCategory" class="form-select category-select" onchange="updateSkills()">
                                            <option value="">Select category</option>
                                            <option value="technology">Technology & Programming</option>
                                            <option value="creative">Creative Arts & Design</option>
                                            <option value="languages">Languages & Communication</option>
                                            <option value="business">Business & Professional</option>
                                            <option value="home">Home Services & DIY</option>
                                            <option value="fitness">Fitness & Wellness</option>
                                            
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="input-group">
                                    <label for="skillsSkill">Skill</label>
                                    <div class="select-wrapper">
                                        <select id="skillsSkill" class="form-select skill-select">
                                            <option value="">Select skill</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="button" class="add-skill-btn" onclick="addSkill()">
                                <span class="plus-icon">+</span>
                                Add Skill
                            </button>
                        </div>
                    </div>
                    
                    <!-- Selected Skills Display -->
                    <div class="selected-skills" id="skillsSkillsList">
                        <!-- Selected skills will appear here -->
                    </div>
                </div>
            </div>

            <!-- Form Buttons -->
            <div class="form-buttons">
                <button type="submit" class="submit-button">Create Event</button>
                <button type="button" class="cancel-button">Cancel</button>
            </div>
        </form>
    </div>

    <script src="eventsJs/addevent.js"></script>
</body>
</html>
