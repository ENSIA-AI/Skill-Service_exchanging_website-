<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Event</title>
    <link rel="stylesheet" href="../../assets/css/addevent.css">
</head>
<body>
    <div class="create-event-container">
        <!-- Left Side - Image -->
        <div class="event-image-section">
            <img src="../../assets/images/homeinp/createeventpic.png" alt="Create Event" class="event-illustration">
        </div>

        <!-- Right Side - Form -->
        <div class="event-form-section">
            <div class="form-header">
                <h1>Create New Event</h1>
                <button class="close-btn" onclick="window.history.back()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form id="createEventForm">
                <!-- First Container: Event Details -->
                <div class="form-container">
                    <div class="form-group">
                        <label for="eventTitle">Event Title</label>
                        <input 
                            type="text" 
                            id="eventTitle" 
                            class="form-input" 
                            placeholder="e.g., Web Development Workshop"
                            required
                        >
                        <span class="error-message">Event title is required</span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="eventDate">Event Date</label>
                            <input 
                                type="date" 
                                id="eventDate" 
                                class="form-input date-input" 
                                placeholder="dd/mm/yyyy"
                                required
                            >
                            <span class="error-message">Event date is required</span>
                        </div>

                        <div class="form-group">
                            <label for="location">Location</label>
                            <input 
                                type="text" 
                                id="location" 
                                class="form-input" 
                                placeholder="e.g., Community Center"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea 
                            id="description" 
                            class="form-input form-textarea" 
                            placeholder="Describe your event..."
                            rows="4"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="maxAttendees">Max Attendees</label>
                        <input 
                            type="number" 
                            id="maxAttendees" 
                            class="form-input" 
                            placeholder="e.g., 20"
                            min="1" max="100"
                        >
                    </div>
                </div>

                <!-- Second Container: Skills Needed -->
                <div class="form-container">
                    <div class="skills-header">
                        <h3>Skills Needed</h3>
                        <span class="skills-count">0/5</span>
                    </div>

                    <div class="skills-inputs">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" class="form-input form-select">
                                <option value="">Select category</option>
                                <option value="technology">Technology & Programming</option>
                                <option value="design">Design & Creative</option>
                                <option value="business">Business & Finance</option>
                                <option value="marketing">Marketing & Sales</option>
                                <option value="writing">Writing & Content</option>
                                <option value="education">Education & Training</option>
                                <option value="health">Health & Wellness</option>
                                <option value="home">Home Services & DIY</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="skill">Skill</label>
                            <select id="skill" class="form-input form-select" disabled>
                                <option value="">Select category first</option>
                            </select>
                        </div>

                        <button type="button" class="add-skill-btn" id="addSkillBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Add Skill
                        </button>
                    </div>

                    <!-- Selected Skills Container -->
                    <div class="selected-skills" id="selectedSkills">
                        <!-- Skills will be added here dynamically -->
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="submit" class="btn-create">Create Event</button>
                    <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="eventsJs/addevent.js"></script>
</body>
</html>
