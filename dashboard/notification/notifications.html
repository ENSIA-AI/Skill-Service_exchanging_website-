<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="../../assets/css/notifications.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    
    <style>
        /* Additional styles to match your image exactly */
        :root {
            
            --clr-blue: #268cff;
            --clr-text: #e6e6e6;
        }

        body {
            background: var(--clr-main);
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            color: var(--clr-text);
        }

        .notif-container {
            padding: 30px;
            width: 100%;
            margin-top:30px ;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header-section h1 {
            margin: 0;
            font-size: 28px;
        }

        .header-section p {
            opacity: .9;
            margin: 0;
        }

        .markall {
            margin-left: auto;
            padding: 8px 20px;
            background: var(--clr-btn);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #000;
            font-weight: 500;
        }

        /* TABS */
        .notifications-tabs {
            display: flex;
            gap: 12px;
            margin: 20px 0 30px 0;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 16px;
            background: #2d314d;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            color: var(--clr-text);
        }

        .tab.active {
            background: var(--clr-btn);
            color: #000;
            font-weight: 500;
        }

        /* NOTIFICATION CARD */
        .notification-card {
            display: flex;
            background: var(--clr-lighter);
            border-radius: 15px;
            padding: 20px;
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            border-left: 4px solid var(--clr-btn);
        }

        .notification-card.new {
            border-left-color: var(--clr-btn);
        }

        .notification-icons img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
        }

        .notification-body {
            flex: 1;
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .notification-title {
            font-weight: 600;
            font-size: 17px;
        }

        .notification-badge {
            background: var(--clr-btn);
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 20px;
            color: #000;
            font-weight: 500;
        }

        .notification-time {
            margin-left: auto;
            font-size: 14px;
            opacity: .8;
        }

        .notification-text {
            margin: 10px 0 15px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .notification-actions {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            background: var(--clr-blue);
            border: none;
            color: white;
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--clr-btn);
            color: var(--clr-btn);
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .notification-delete {
            position: absolute;
            right: 20px;
            bottom: 15px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .notification-delete img {
            width: 20px;
            height: 20px;
            display: block;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="notif-container">

        <div class="header-section">
            <h1>Notifications</h1>
            <p>You have <span id="unread-count">5</span> unread notifications</p>
            <button class="markall">Mark All as Read</button>
        </div>

        <!-- Tabs Section -->
        <div class="notifications-tabs">
            <button class="tab active">All (14)</button>
            <button class="tab">Unread (5)</button>
            <button class="tab">Exchange History </button>
            <button class="tab">Events</button>
            <button class="tab">Credits</button>
            <button class="tab">Reviews</button>
        </div>

        <div class="divider"></div>

        <!-- Notifications Container -->
        <div id="notifications-container"></div>

    </div>

<script>
/* NOTIFICATION DATA*/
const notifications = [
    // Example row shaped like UserNotifications table
    {
        NotificationId: 1,
        UserId: 1,
        NotificationType: "booking",
        Title: "New exchange request",
        Message: "User Sarah requested an exchange for your JavaScript course.",
        IsRead: "no",
        CreatedAt: "5 minutes ago", // in real app: server-formatted datetime
        NotificationSection: "Exchange",
        // Web avatar image
        image: "https://images.pexels.com/photos/771742/pexels-photo-771742.jpeg?auto=compress&cs=tinysrgb&w=120&h=120&dpr=2"
    },
    {
        NotificationId: 2,
        UserId: 1,
        NotificationType: "earned",
        Title: "Credits Earned!",
        Message: "You earned 50 credits for completing a session.",
        IsRead: "no",
        CreatedAt: "1 hour ago",
        NotificationSection: "credits",
        image: "https://images.pexels.com/photos/1181519/pexels-photo-1181519.jpeg?auto=compress&cs=tinysrgb&w=120&h=120&dpr=2"
    }
];

/* TEMPLATE RENDERING
 * This now accepts either:
 *  - a front-end object (id, title, message, time, image, category, isNew, action)
 *  - a raw row from UserNotifications table (NotificationId, Title, Message, IsRead, CreatedAt, NotificationSection, NotificationType)
 */
function renderNotification(n) {
    // Normalize fields from DB-style object or front-end style object
    const id = n.NotificationId ?? n.notificationId ?? n.id;
    const title = n.Title ?? n.title ?? '';
    const message = n.Message ?? n.message ?? '';
    const isRead = (n.IsRead ?? n.is_read ?? (n.isNew === false ? 'yes' : 'no')).toString().toLowerCase();
    const createdAt = n.CreatedAt ?? n.created_at ?? n.time ?? '';
    const section = (n.NotificationSection ?? n.notification_section ?? n.category ?? '').toString();
    const type = (n.NotificationType ?? n.notification_type ?? '').toString();

    // Compute "new" state
    const isNew = isRead === 'no';

    // Category (used in data-category + tab filtering)
    let category = section.toLowerCase();
    if (!category) {
        const t = type.toLowerCase();
        if (t.includes('earned') || t.includes('spent') || t.includes('credit')) category = 'credits';
        else if (t.includes('event')) category = 'events';
        else if (t.includes('rating') || t.includes('review')) category = 'reviews';
        else category = (n.category || 'general').toString().toLowerCase();
    }

    // Icon based on section/type
    let image = n.image || '../../assets/icons/bell2.svg';
    const lowerType = type.toLowerCase();
    if (category === 'credits' || lowerType === 'earned' || lowerType === 'spent') {
        image = '../../assets/icons/coinss.png';
    } else if (category === 'events' || lowerType.includes('event')) {
        image = '../../assets/icons/calendar.svg';
    } else if (category === 'reviews' || lowerType === 'rating') {
        image = '../../assets/icons/five-star-rating-icon.svg';
    } else if (category === 'exchange') {
        image = '../../assets/icons/people_4.svg';
    }

    // Time label – if backend already formatted, use that string
    let timeLabel = createdAt;
    if (createdAt instanceof Date) {
        timeLabel = createdAt.toLocaleString('en-DZ', {
            year: 'numeric',
            month: 'short',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    // Primary action text
    let action = n.action || '';
    if (!action) {
        switch (category) {
            case 'exchange':
                action = 'View Exchange';
                break;
            case 'events':
                action = 'View Event';
                break;
            case 'credits':
                action = 'View Wallet';
                break;
            case 'reviews':
                action = 'View Review';
                break;
            default:
                action = '';
        }
    }

    return `
    <div class="notification-card ${isNew ? 'new' : ''}" data-id="${id}" data-category="${category}">
        
        <div class="notification-icons">
            <img src="${image}" alt="Profile">
        </div>

        <div class="notification-body">
            <div class="notification-header">
                <span class="notification-title">${title}</span>
                ${isNew ? '<span class="notification-badge">New</span>' : ''}
                <span class="notification-time">${timeLabel}</span>
            </div>

            <p class="notification-text">${message}</p>

            <div class="notification-actions">
                ${action ? `<button class="btn-primary">${action}</button>` : ""}
                <button class="btn-secondary mark-read-btn">Mark as Read</button>
            </div>
        </div>

        <button class="notification-delete" title="Delete notification">
            <img src="../../assets/icons/trash.svg" alt="Delete notification">
        </button>

    </div>`;
}

/* --------------------
   INITIAL RENDER
---------------------*/
const container = document.getElementById("notifications-container");
container.innerHTML = notifications.map(renderNotification).join("");

/*MARK AS READ*/
document.addEventListener("click", (e) => {
    if (e.target.classList.contains("mark-read-btn")) {
        const card = e.target.closest(".notification-card");
        card.classList.remove("new");

        // remove badge
        const badge = card.querySelector(".notification-badge");
        if (badge) badge.remove();

        // update unread counter
        const unread = document.querySelectorAll(".notification-card.new").length;
        document.getElementById("unread-count").textContent = unread;
    }
});

/*DELETE NOTIFICATION*/
document.addEventListener("click", (e) => {
    if (e.target.closest(".notification-delete")) {
        const card = e.target.closest(".notification-card");
        card.remove();

        const unread = document.querySelectorAll(".notification-card.new").length;
        document.getElementById("unread-count").textContent = unread;
    }
});

/* 
   MARK ALL AS READ
*/
document.querySelector(".markall").addEventListener("click", () => {
    document.querySelectorAll(".notification-card.new").forEach(card => {
        card.classList.remove("new");
        const badge = card.querySelector(".notification-badge");
        if (badge) badge.remove();
    });
    
    const unread = document.querySelectorAll(".notification-card.new").length;
    document.getElementById("unread-count").textContent = unread;
});

/* 
   TAB FUNCTIONALITY
   Tabs:
   - All (...)
   - Unread (...)
   - Exchange History
   - Events
   - Credits
   - Reviews
*/
document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", function() {
        // Remove active class from all tabs
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        // Add active class to clicked tab
        this.classList.add("active");

        const label = this.textContent.toLowerCase();
        const cards = document.querySelectorAll(".notification-card");

        // Show all by default
        cards.forEach(card => (card.style.display = "flex"));

        // All tab: nothing else to do
        if (label.includes("all")) return;

        // Unread tab: only show cards with "new" class
        if (label.includes("unread")) {
            cards.forEach(card => {
                card.style.display = card.classList.contains("new") ? "flex" : "none";
            });
            return;
        }

        // Other tabs filter by data-category set in renderNotification()
        let targetCategory = "";
        if (label.includes("exchange")) targetCategory = "exchange";
        else if (label.includes("events")) targetCategory = "events";
        else if (label.includes("credits")) targetCategory = "credits";
        else if (label.includes("reviews")) targetCategory = "reviews";

        if (targetCategory) {
            cards.forEach(card => {
                const cat = (card.getAttribute("data-category") || "").toLowerCase();
                card.style.display = cat === targetCategory ? "flex" : "none";
            });
        }
    });
});
</script>

</body>
</html>
