<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="../../assets/css/notifications.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    
    <style>
        /* Additional styles to match your image exactly */
        :root {
            
            --clr-blue: #268cff;
            --clr-text: #e6e6e6;
        }

        body {
            background: var(--clr-main);
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            color: var(--clr-text);
        }

        .notif-container {
            padding: 30px;
            width: 100%;
            margin: 0 auto;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header-section h1 {
            margin: 0;
            font-size: 28px;
        }

        .header-section p {
            opacity: .9;
            margin: 0;
        }

        .markall {
            margin-left: auto;
            padding: 8px 20px;
            background: var(--clr-org);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #000;
            font-weight: 500;
        }

        /* TABS */
        .notifications-tabs {
            display: flex;
            gap: 12px;
            margin: 20px 0 30px 0;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 16px;
            background: #2d314d;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            color: var(--clr-text);
        }

        .tab.active {
            background: var(--clr-org);
            color: #000;
            font-weight: 500;
        }

        /* NOTIFICATION CARD */
        .notification-card {
            display: flex;
            background: var(--clr-lighter);
            border-radius: 15px;
            padding: 20px;
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            border-left: 4px solid var(--clr-org);
        }

        .notification-card.new {
            border-left-color: var(--clr-org);
        }

        .notification-icons img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
        }

        .notification-body {
            flex: 1;
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .notification-title {
            font-weight: 600;
            font-size: 17px;
        }

        .notification-badge {
            background: var(--clr-org);
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 20px;
            color: #000;
            font-weight: 500;
        }

        .notification-time {
            margin-left: auto;
            font-size: 14px;
            opacity: .8;
        }

        .notification-text {
            margin: 10px 0 15px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .notification-actions {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            background: var(--clr-blue);
            border: none;
            color: white;
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--clr-org);
            color: var(--clr-org);
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .notification-delete {
            position: absolute;
            right: 20px;
            bottom: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: #ff8080;
            font-size: 16px;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="notif-container">

        <div class="header-section">
            <h1>Notifications</h1>
            <p>You have <span id="unread-count">5</span> unread notifications</p>
            <button class="markall">Mark All as Read</button>
        </div>

        <!-- Tabs Section -->
        <div class="notifications-tabs">
            <button class="tab active">All (14)</button>
            <button class="tab">Unread (5)</button>
            <button class="tab">Matches</button>
            <button class="tab">Events</button>
            <button class="tab">Credits</button>
            <button class="tab">Reviews</button>
        </div>

        <div class="divider"></div>

        <!-- Notifications Container -->
        <div id="notifications-container"></div>

    </div>

<script>
/* NOTIFICATION DATA*/
const notifications = [
    {
        id: 1,
        title: "New Match Found!",
        message: "Sarah Chen is looking for Web Development and offers Graphic Design - Perfect match!",
        time: "5 minutes ago",
        image: "https://i.pravatar.cc/60?img=12",
        category: "matches",
        isNew: true,
        action: "View Details"
    },
    {
        id: 2,
        title: "Credits Earned!",
        message: "You earned 50 credits for completing a session with Michael Torres",
        time: "1 hour ago",
        image: "https://i.pravatar.cc/60?img=33",
        category: "credits",
        isNew: true,
        action: "✔️ Mark as Read"
    }
];

/* TEMPLATE RENDERING*/
function renderNotification(n) {
    return `
    <div class="notification-card ${n.isNew ? 'new' : ''}" data-id="${n.id}" data-category="${n.category}">
        
        <div class="notification-icons">
            <img src="${n.image}" alt="Profile">
        </div>

        <div class="notification-body">
            <div class="notification-header">
                <span class="notification-title">${n.title}</span>
                ${n.isNew ? '<span class="notification-badge">New</span>' : ''}
                <span class="notification-time">${n.time}</span>
            </div>

            <p class="notification-text">${n.message}</p>

            <div class="notification-actions">
                ${n.action ? `<button class="btn-primary">${n.action}</button>` : ""}
                <button class="btn-secondary mark-read-btn">Mark as Read</button>
            </div>
        </div>

        <button class="notification-delete">
            <i class="fa fa-trash">🗑️</i>
        </button>

    </div>`;
}

/* --------------------
   INITIAL RENDER
---------------------*/
const container = document.getElementById("notifications-container");
container.innerHTML = notifications.map(renderNotification).join("");

/*MARK AS READ*/
document.addEventListener("click", (e) => {
    if (e.target.classList.contains("mark-read-btn")) {
        const card = e.target.closest(".notification-card");
        card.classList.remove("new");

        // remove badge
        const badge = card.querySelector(".notification-badge");
        if (badge) badge.remove();

        // update unread counter
        const unread = document.querySelectorAll(".notification-card.new").length;
        document.getElementById("unread-count").textContent = unread;
    }
});

/*DELETE NOTIFICATION*/
document.addEventListener("click", (e) => {
    if (e.target.closest(".notification-delete")) {
        const card = e.target.closest(".notification-card");
        card.remove();

        const unread = document.querySelectorAll(".notification-card.new").length;
        document.getElementById("unread-count").textContent = unread;
    }
});

/* 
   MARK ALL AS READ
*/
document.querySelector(".markall").addEventListener("click", () => {
    document.querySelectorAll(".notification-card.new").forEach(card => {
        card.classList.remove("new");
        const badge = card.querySelector(".notification-badge");
        if (badge) badge.remove();
    });
    
    const unread = document.querySelectorAll(".notification-card.new").length;
    document.getElementById("unread-count").textContent = unread;
});

/* 
   TAB FUNCTIONALITY
*/
document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", function() {
        // Remove active class from all tabs
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        // Add active class to clicked tab
        this.classList.add("active");
        
        // Here you would typically filter notifications by category
        // For now, we'll just show all
        const category = this.textContent.toLowerCase();
        if (category.includes("all")) {
            document.querySelectorAll(".notification-card").forEach(card => {
                card.style.display = "flex";
            });
        }
    });
});
</script>

</body>
</html>
