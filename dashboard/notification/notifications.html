<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="../../assets/css/notifications.css">
    <link rel="stylesheet" href="../../assets/css/style.css">

    <style>
        /* Additional styles to match your image exactly */
        :root {

            --clr-blue: #268cff;
            --clr-text: #e6e6e6;
        }

        body {
            background: var(--clr-main);
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            color: var(--clr-text);
        }

        .notif-container {
            padding: 30px;
            width: 100%;
            margin-top: 30px;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header-section h1 {
            margin: 0;
            font-size: 28px;
        }

        .header-section p {
            opacity: .9;
            margin: 0;
        }

        .markall {
            margin-left: auto;
            padding: 8px 20px;
            background: var(--clr-btn);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #000;
            font-weight: 500;
        }

        /* TABS */
        .notifications-tabs {
            display: flex;
            gap: 12px;
            margin: 20px 0 30px 0;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 16px;
            background: #2d314d;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            color: var(--clr-text);
        }

        .tab.active {
            background: var(--clr-btn);
            color: #000;
            font-weight: 500;
        }

        /* NOTIFICATION CARD */
        .notification-card {
            display: flex;
            background: var(--clr-lighter);
            border-radius: 15px;
            padding: 20px;
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            border-left: 4px solid var(--clr-btn);
        }

        .notification-card.new {
            border-left-color: var(--clr-btn);
        }

        .notification-icons img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
        }

        .notification-body {
            flex: 1;
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .notification-title {
            font-weight: 600;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notification-type-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--clr-btn);
        }

        .notification-type-icon img {
            width: 18px;
            height: 18px;
            display: block;
        }

        .notification-type-icon svg {
            width: 18px;
            height: 18px;
        }

        .notification-badge {
            background: var(--clr-btn);
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 20px;
            color: #000;
            font-weight: 500;
        }

        .notification-time {
            margin-left: auto;
            font-size: 14px;
            opacity: .8;
        }

        .notification-text {
            margin: 10px 0 15px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .notification-actions {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            background: var(--clr-blue);
            border: none;
            color: white;
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--clr-btn);
            color: var(--clr-btn);
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .notification-delete {
            position: absolute;
            right: 20px;
            bottom: 15px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .notification-delete img {
            width: 20px;
            height: 20px;
            display: block;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <div class="notif-container">

        <div class="header-section">
            <h1>Notifications</h1>
            <p>You have <span id="unread-count">0</span> unread notifications</p>
            <button class="markall">Mark All as Read</button>
        </div>

        <!-- Tabs Section -->
        <div class="notifications-tabs">
            <button class="tab active">All</button>
            <button class="tab">Unread</button>
            <button class="tab">Exchange History </button>
            <button class="tab">Events</button>
            <button class="tab">Credits</button>
            <button class="tab">Reviews</button>
        </div>

        <div class="divider"></div>

        <!-- Notifications Container -->
        <div id="notifications-container"></div>

    </div>

    <script>

        /**
         * Parse MySQL/ISO or dd/mm/yy format string to Date object
         */
        function parseDateTime(dateTimeStr) {
            if (!dateTimeStr || typeof dateTimeStr !== 'string') return null;

            // Try MySQL format first (YYYY-MM-DD HH:MM:SS)
            if (dateTimeStr.includes('-')) {
                // Replace space with T to make it ISO compatible
                const isoStr = dateTimeStr.replace(' ', 'T');
                const date = new Date(isoStr);
                if (!isNaN(date.getTime())) return date;
            }

            // Fallback to dd/mm/yy format
            const ddMmYyPattern = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/;
            const match = dateTimeStr.match(ddMmYyPattern);
            if (match) {
                const day = parseInt(match[1], 10);
                const month = parseInt(match[2], 10) - 1;
                let year = parseInt(match[3], 10);
                if (year < 100) year += 2000;
                const hour = match[4] ? parseInt(match[4], 10) : 0;
                const minute = match[5] ? parseInt(match[5], 10) : 0;
                const second = match[6] ? parseInt(match[6], 10) : 0;
                return new Date(year, month, day, hour, minute, second);
            }
            return new Date(dateTimeStr);
        }

        /**
         * Calculate time difference between notification date and now
         * @param {string|Date} dateTime - The notification creation date/time (from DB: "dd/mm/yy" or "dd/mm/yy HH:MM")
         * @returns {Object} Object with time differences: {seconds, minutes, hours, days, weeks, date}
         */
        function calculateTimeDifference(dateTime) {
            let date;

            // Parse the date
            if (dateTime instanceof Date) {
                date = dateTime;
            } else if (typeof dateTime === 'string') {
                date = parseDateTime(dateTime);
                if (!date || isNaN(date.getTime())) return null;
            } else {
                return null;
            }

            const now = new Date();
            const diffMs = now - date;

            return {
                seconds: Math.floor(diffMs / 1000),
                minutes: Math.floor(diffMs / (1000 * 60)),
                hours: Math.floor(diffMs / (1000 * 60 * 60)),
                days: Math.floor(diffMs / (1000 * 60 * 60 * 24)),
                weeks: Math.floor(diffMs / (1000 * 60 * 60 * 24 * 7)),
                date: date
            };
        }

        /**
         * Format notification time to relative format (e.g., "3h ago") or date if > 1 week
         * @param {string|Date} dateTime - The notification creation date/time (from DB: "dd/mm/yy" or "dd/mm/yy HH:MM")
         * @returns {string} Formatted time string
         */
        function formatNotificationTime(dateTime) {
            // If already a formatted string (for demo data), return as is
            if (typeof dateTime === 'string' && (dateTime.includes('ago') || dateTime.includes('minutes') || dateTime.includes('hours') || dateTime.includes('days'))) {
                return dateTime;
            }

            // Calculate time difference
            const diff = calculateTimeDifference(dateTime);

            if (!diff) {
                return dateTime || 'Just now';
            }

            // Handle future dates (rare but possible with clock drift)
            if (diff.seconds < 0) {
                return 'Just now';
            }
            // Less than 1 minute
            if (diff.seconds < 60) {
                return 'Just now';
            }
            // Less than 1 hour - show minutes
            else if (diff.minutes < 60) {
                return `${diff.minutes}m ago`;
            }
            // Less than 24 hours - show hours
            else if (diff.hours < 24) {
                return `${diff.hours}h ago`;
            }
            // Less than 1 week - show days
            else if (diff.days < 7) {
                return `${diff.days}d ago`;
            }
            // More than 1 week - show formatted date in dd/mm/yy format
            else {
                const day = String(diff.date.getDate()).padStart(2, '0');
                const month = String(diff.date.getMonth() + 1).padStart(2, '0');
                const year = diff.date.getFullYear().toString().slice(-2);
                return `${day}/${month}/${year}`;
            }
        }

        /* TEMPLATE RENDERING
         * This now accepts either:
         *  - a front-end object (id, title, message, time, image, category, isNew, action)
         *  - a raw row from UserNotifications table (NotificationId, Title, Message, IsRead, CreatedAt, NotificationSection, NotificationType)
         * 
         * Optional fields for URLs (if available in DB):
         *  - ExchangeId, PostId, EventId, UserId (for profile), ReviewId
         */
        function renderNotification(n) {
            // Normalize fields from DB-style object or front-end style object
            const id = n.NotificationId ?? n.notificationId ?? n.id;
            const title = n.Title ?? n.title ?? '';
            const message = n.Message ?? n.message ?? '';
            const isRead = (n.IsRead ?? n.is_read ?? (n.isNew === false ? 'yes' : 'no')).toString().toLowerCase();
            const createdAt = n.CreatedAt ?? n.created_at ?? n.time ?? '';
            const section = (n.NotificationSection ?? n.notification_section ?? n.category ?? '').toString();
            const type = (n.NotificationType ?? n.notification_type ?? '').toString();

            // Extract related IDs for URL construction
            const exchangeId = n.ExchangeId ?? n.exchangeId ?? n.exchange_id;
            const postId = n.PostId ?? n.postId ?? n.post_id;
            const eventId = n.EventId ?? n.eventId ?? n.event_id;
            const userId = n.UserId ?? n.userId ?? n.user_id;
            const reviewId = n.ReviewId ?? n.reviewId ?? n.review_id;

            // Compute "new" state
            const isNew = isRead === 'no';

            // Category (used in data-category + tab filtering)
            let category = section.toLowerCase();
            if (!category) {
                const t = type.toLowerCase();
                if (t.includes('earned') || t.includes('spent') || t.includes('credit')) category = 'credits';
                else if (t.includes('event')) category = 'events';
                else if (t.includes('rating') || t.includes('review') || t.includes('like') || t.includes('comment')) category = 'reviews';
                else category = (n.category || 'general').toString().toLowerCase();
            }

            const lowerType = type.toLowerCase();

            // ============================================
            // AVATAR (PFP) + TYPE ICON SELECTION
            // ============================================
            // Main avatar: always a person/profile image (from DB or default)
            let image = n.image || '../../assets/images/Default_pfp.svg';

            // Small type icon shown next to the title, depends on notification type.
            // Can be either:
            //  - a URL to an image (string not starting with "<")
            //  - an inline SVG string (string starting with "<")
            let typeIcon = '';

            if (category === 'exchange') {
                // Exchange History Section – inline SVG icons colored via --clr-btn
                const exchangeBookingIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M8 2v4M16 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>`;
                const exchangeAcceptedIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M5 20c1.5-3 3.5-4.5 7-4.5s5.5 1.5 7 4.5" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>`;
                const exchangeCompletedIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>`;
                const exchangeRefusedIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>`;

                if (lowerType === 'booking') {
                    typeIcon = exchangeBookingIcon;
                } else if (lowerType === 'accepted') {
                    typeIcon = exchangeAcceptedIcon;
                } else if (lowerType === 'completing') {
                    typeIcon = exchangeCompletedIcon;
                } else if (lowerType === 'being_refused') {
                    typeIcon = exchangeRefusedIcon;
                } else {
                    typeIcon = exchangeAcceptedIcon;
                }
            } else if (category === 'reviews') {
                // Use inline SVG icons so we can color them with --clr-btn
                const reviewStarIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" d="M12 2 14.9 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 9.1 8.26 12 2z"/>
            </svg>`;
                const reviewCommentIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" d="M4 4h16v11a2 2 0 0 1-2 2H8l-4 3V4z"/>
            </svg>`;

                if (lowerType === 'like') {
                    // Post/comment liked
                    typeIcon = reviewStarIcon;
                } else if (lowerType === 'comment') {
                    // New comment on post
                    typeIcon = reviewCommentIcon;
                } else if (lowerType === 'rating') {
                    // New rating/review
                    typeIcon = reviewStarIcon;
                } else {
                    typeIcon = reviewStarIcon;
                }
            } else if (category === 'events') {
                // Events – inline calendar / cross icons with --clr-btn
                const eventAcceptedIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M8 2v4M16 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M9 15l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>`;
                const eventRejectedIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M8 2v4M16 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M10 14l4 4M14 14l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>`;

                if (lowerType === 'acceptedinevent') {
                    typeIcon = eventAcceptedIcon;
                } else if (lowerType === 'rejectedfromevent') {
                    typeIcon = eventRejectedIcon;
                } else {
                    typeIcon = eventAcceptedIcon;
                }
            } else if (category === 'credits') {
                // Inline SVG coin icon, colored using --clr-btn
                const creditsCoinIcon = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>`;

                if (lowerType === 'earned' || lowerType === 'spent') {
                    typeIcon = creditsCoinIcon;
                } else {
                    typeIcon = creditsCoinIcon;
                }
            }

            // Time label – format relative time or date
            let timeLabel = formatNotificationTime(createdAt);

            // ============================================
            // ACTION BUTTON & URL CONSTRUCTION
            // ============================================
            let action = '';
            let actionUrl = '#';
            let needsUrl = true;

            if (category === 'exchange') {
                if (lowerType === 'booking') {
                    action = 'Respond';
                    // Link to exchange details or post details
                    actionUrl = exchangeId
                        ? `../post/postdetails.php?exchangeId=${exchangeId}`
                        : (postId ? `../post/postdetails.php?postId=${postId}` : '../post/posts.php');
                } else if (lowerType === 'accepted') {
                    action = 'View Exchange';
                    actionUrl = exchangeId
                        ? `../post/postdetails.php?exchangeId=${exchangeId}`
                        : '../post/posts.php';
                } else if (lowerType === 'completing') {
                    action = 'Rate & Review';
                    // Link to review/rating page or exchange details
                    actionUrl = exchangeId
                        ? `../post/postdetails.php?exchangeId=${exchangeId}&action=review`
                        : '../post/posts.php';
                } else if (lowerType === 'being_refused') {
                    action = 'View Details';
                    actionUrl = postId ? `../post/postdetails.php?postId=${postId}` : '../post/posts.php';
                } else {
                    action = 'View Exchange';
                    actionUrl = '../post/posts.php';
                }
            } else if (category === 'reviews') {
                if (lowerType === 'like') {
                    action = 'View Post';
                    actionUrl = postId ? `../post/postdetails.php?postId=${postId}` : '../post/posts.php';
                } else if (lowerType === 'comment') {
                    action = 'View Comments';
                    actionUrl = postId ? `../post/postdetails.php?postId=${postId}#comments` : '../post/posts.php';
                } else if (lowerType === 'rating') {
                    action = 'View Review';
                    actionUrl = reviewId
                        ? `../profile/profile.php?reviewId=${reviewId}`
                        : (userId ? `../profile/profile.php?userId=${userId}` : '../profile/profile.php');
                } else {
                    action = 'View';
                    actionUrl = '../post/posts.php';
                }
            } else if (category === 'events') {
                if (lowerType === 'acceptedinevent') {
                    action = 'View Event';
                    actionUrl = eventId ? `../events/eventdetails.php?eventId=${eventId}` : '../events/events.php';
                } else if (lowerType === 'rejectedfromevent') {
                    action = 'Browse Events';
                    actionUrl = '../events/events.php';
                } else {
                    action = 'View Event';
                    actionUrl = eventId ? `../events/eventdetails.php?eventId=${eventId}` : '../events/events.php';
                }
            } else if (category === 'credits') {
                if (lowerType === 'earned' || lowerType === 'spent') {
                    action = 'View Wallet';
                    // Link to profile or credits section
                    actionUrl = '../profile/profile.php#credits';
                    needsUrl = true;
                } else {
                    action = 'View Wallet';
                    actionUrl = '../profile/profile.php#credits';
                }
            } else {
                needsUrl = false;
            }

            // Build action button HTML
            let actionButton = '';
            if (action && needsUrl) {
                actionButton = `<a href="${actionUrl}" class="btn-primary" style="text-decoration: none; display: inline-block;">${action}</a>`;
            } else if (action) {
                actionButton = `<button class="btn-primary">${action}</button>`;
            }

            const senderPFP = n.SenderPFP ?? n.sender_pfp ?? '../../assets/images/Default_pfp.svg';
            const senderName = n.SenderName ?? n.sender_name ?? 'System';

            return `
    <div class="notification-card ${isNew ? 'new' : ''}" data-id="${id}" data-category="${category}" data-created="${createdAt}">
        
        <div class="notification-body">
            <div class="notification-header">
                <span class="notification-title">
                    <img src="${senderPFP}" class="sender-pfp" alt="${senderName}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--clr-btn);">
                    ${typeIcon
                    ? (
                        typeof typeIcon === 'string' && typeIcon.trim().startsWith('<')
                            ? `<span class="notification-type-icon">${typeIcon}</span>`
                            : `<span class="notification-type-icon"><img src="${typeIcon}" alt="type icon"></span>`
                    )
                    : ''
                }
                    ${title}
                </span>
                ${isNew ? '<span class="notification-badge">New</span>' : ''}
                <span class="notification-time" data-timestamp="${createdAt}">${timeLabel}</span>
            </div>

            <p class="notification-text">${message}</p>

            <div class="notification-actions">
                ${actionButton}
                <button class="btn-secondary mark-read-btn">Mark as Read</button>
            </div>
        </div>

        <button class="notification-delete" title="Delete notification">
            <img src="../../assets/icons/trash.svg" alt="Delete notification">
        </button>

    </div>`;
        }

        /* --------------------
           API INTEGRATION
        ---------------------*/
        async function fetchNotifications() {
            try {
                console.log('Fetching notifications...');
                const response = await fetch('../../api/notifications/fetch.php');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log('Notification data received:', data);

                if (data.success && data.notifications.length > 0) {
                    renderAll(data.notifications);
                } else if (data.success && data.notifications.length === 0) {
                    document.getElementById("notifications-container").innerHTML = '<div class="notification-card"><p>No notifications found.</p></div>';
                    document.getElementById("unread-count").textContent = 0;
                } else {
                    console.error('Failed to fetch notifications:', data.message);
                    document.getElementById("notifications-container").innerHTML = '<div class="notification-card"><p>Failed to load notifications.</p></div>';
                }
            } catch (error) {
                console.error('Error fetching notifications:', error);
                document.getElementById("notifications-container").innerHTML = '<div class="notification-card"><p>Error connecting to the notification service.</p></div>';
            }
        }

        function renderAll(items) {
            const container = document.getElementById("notifications-container");
            container.innerHTML = items.map(renderNotification).join("");

            // Update unread count
            const unread = items.filter(n => (n.IsRead ?? n.is_read) === 'no').length;
            document.getElementById("unread-count").textContent = unread;
        }

        async function markAsRead(notifId, card) {
            try {
                const response = await fetch('../../api/notifications/mark_read.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notificationId: notifId })
                });
                const data = await response.json();

                if (data.success) {
                    card.classList.remove("new");
                    const badge = card.querySelector(".notification-badge");
                    if (badge) badge.remove();

                    // update unread counter
                    const unread = document.querySelectorAll(".notification-card.new").length;
                    document.getElementById("unread-count").textContent = unread;
                }
            } catch (error) {
                console.error('Error marking as read:', error);
            }
        }

        async function deleteNotification(notifId, card) {
            try {
                const response = await fetch('../../api/notifications/delete.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notificationId: notifId })
                });
                const data = await response.json();

                if (data.success) {
                    card.remove();
                    // update unread counter
                    const unread = document.querySelectorAll(".notification-card.new").length;
                    document.getElementById("unread-count").textContent = unread;
                }
            } catch (error) {
                console.error('Error deleting notification:', error);
            }
        }

        function startTimer() {
            // Update relative times every 60 seconds
            setInterval(() => {
                const timeElements = document.querySelectorAll('.notification-time[data-timestamp]');
                timeElements.forEach(el => {
                    const timestamp = el.getAttribute('data-timestamp');
                    if (timestamp) {
                        el.textContent = formatNotificationTime(timestamp);
                    }
                });
            }, 60000);
        }

        /* INITIALIZE */
        fetchNotifications();
        startTimer();

        /* ACTIONS */
        document.addEventListener("click", async (e) => {
            const card = e.target.closest(".notification-card");
            if (!card) return;

            const notifId = card.dataset.id;

            if (e.target.classList.contains("mark-read-btn")) {
                await markAsRead(notifId, card);
            }

            if (e.target.closest(".notification-delete")) {
                if (confirm('Are you sure you want to delete this notification?')) {
                    await deleteNotification(notifId, card);
                }
            }
        });

        /* 
           MARK ALL AS READ
        */
        document.querySelector(".markall").addEventListener("click", () => {
            document.querySelectorAll(".notification-card.new").forEach(card => {
                card.classList.remove("new");
                const badge = card.querySelector(".notification-badge");
                if (badge) badge.remove();
            });

            const unread = document.querySelectorAll(".notification-card.new").length;
            document.getElementById("unread-count").textContent = unread;
        });

        /* 
           TAB FUNCTIONALITY
           Tabs:
           - All (...)
           - Unread (...)
           - Exchange History
           - Events
           - Credits
           - Reviews
        */
        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", function () {
                // Remove active class from all tabs
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                // Add active class to clicked tab
                this.classList.add("active");

                const label = this.textContent.toLowerCase();
                const cards = document.querySelectorAll(".notification-card");

                // Show all by default
                cards.forEach(card => (card.style.display = "flex"));

                // All tab: nothing else to do
                if (label.includes("all")) return;

                // Unread tab: only show cards with "new" class
                if (label.includes("unread")) {
                    cards.forEach(card => {
                        card.style.display = card.classList.contains("new") ? "flex" : "none";
                    });
                    return;
                }

                // Other tabs filter by data-category set in renderNotification()
                let targetCategory = "";
                if (label.includes("exchange")) targetCategory = "exchange";
                else if (label.includes("events")) targetCategory = "events";
                else if (label.includes("credits")) targetCategory = "credits";
                else if (label.includes("reviews")) targetCategory = "reviews";

                if (targetCategory) {
                    cards.forEach(card => {
                        const cat = (card.getAttribute("data-category") || "").toLowerCase();
                        card.style.display = cat === targetCategory ? "flex" : "none";
                    });
                }
            });
        });
    </script>

</body>

</html>
