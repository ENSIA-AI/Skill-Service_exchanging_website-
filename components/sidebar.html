    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>
<body>
    <aside class="container">
        <div class="sidebar">
            <div class="home-section">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house h-5 w-5" aria-hidden="true">
                    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
                    <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                <a href="../dashboard/post/posts.php" class="name">Home</a>
            </div>

            <div class="notification-section">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell h-5 w-5" aria-hidden="true">
                    <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
                    <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path>
                </svg>
                <a href="../dashboard/notification/notifications.php" class="name">Notifications</a>
            </div>

            <div class="events-section">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar h-5 w-5" aria-hidden="true">

                    <path d="M3 10h18"></path>

                <a href="../dashboard/events/events.php" class="name">Events</a>
            </div>

            <div class="profile-section">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user h-5 w-5" aria-hidden="true">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <a href="/Skill-Service_exchanging_website-/dashboard/profile/profile.php" class="name">Profile</a>
            </div>

            <div class="logout-section">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out h-5 w-5" aria-hidden="true">
                    <path d="m16 17 5-5-5-5"></path>
                    <path d="M21 12H9"></path>
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                </svg>
                <span class="name">Logout</span>
            </div>
        </div>
    </aside>

    <script >
                    
            document.addEventListener('DOMContentLoaded', function() {
                const sidebarContainer = document.querySelector('.container');
                const sidebar = document.querySelector('.sidebar');
                const logoutSection = document.querySelector('.logout-section');
                
                console.log('Sidebar script loaded, container found:', !!sidebarContainer);

                let isSidebarVisible = false;

                // Handle sidebar toggle from header
                document.addEventListener('toggleSidebar', function() {
                    if (window.innerWidth <= 768) {
                        isSidebarVisible = !isSidebarVisible;
                        
                        if (isSidebarVisible) {
                            // Show sidebar
                            sidebarContainer.style.display = 'flex';
                            sidebarContainer.style.animation = 'slideIn 0.3s ease forwards';
                        } else {
                            // Hide sidebar with animation
                            sidebarContainer.style.animation = 'slideOut 0.3s ease forwards';
                            setTimeout(() => {
                                sidebarContainer.style.display = 'none';
                            }, 300);
                        }
                        
                        console.log('Sidebar toggled, visible:', isSidebarVisible);
                    }
                });

                
                if (logoutSection) {
                    logoutSection.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (confirm('Are you sure you want to logout?')) {
                            console.log('User logged out');
                            window.location.href = '/Skill-Service_exchanging_website-/index.html';
                        }
                    });
                }

                
                const sidebarSections = document.querySelectorAll('.sidebar > div');
                
                sidebarSections.forEach(section => {
                    section.style.cursor = 'pointer';
                    
                    section.addEventListener('click', function(e) {
                       
                        if (e.target.tagName === 'A' || e.target.closest('a')) {
                            return;
                        }
                        
                        const link = this.querySelector('a');
                        if (link && link.href) {
                            if (this.classList.contains('logout-section')) {
                                if (confirm('Are you sure you want to logout?')) {
                                    window.location.href = '/login.html';
                                }
                            } else {
                                window.location.href = link.href;
                            }
                        }
                    });
                });

                
                sidebar.addEventListener('click', function(e) {
                    if (e.target.tagName === 'A' && window.innerWidth <= 768) {
                        setTimeout(() => {
                            sidebarContainer.style.animation = 'slideOut 0.3s ease forwards';
                            setTimeout(() => {
                                sidebarContainer.style.display = 'none';
                                isSidebarVisible = false;
                            }, 300);
                        }, 100);
                    }
                });

                
                document.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768 && 
                        isSidebarVisible &&
                        !e.target.closest('.container') && 
                        !e.target.closest('.humberger')) {
                        
                        sidebarContainer.style.animation = 'slideOut 0.3s ease forwards';
                        setTimeout(() => {
                            sidebarContainer.style.display = 'none';
                            isSidebarVisible = false;
                        }, 300);
                    }
                });

                
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        sidebarContainer.style.display = 'flex';
                        sidebarContainer.style.animation = '';
                        isSidebarVisible = false;
                    } else {
                        sidebarContainer.style.display = 'none';
                        isSidebarVisible = false;
                    }
                });

                
                if (window.innerWidth <= 768) {
                    sidebarContainer.style.display = 'none';
                    isSidebarVisible = false;
                }
            });
    </script>
</body>
</html>
